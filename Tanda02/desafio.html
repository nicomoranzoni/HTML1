<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h2>Formulario para inscripcion a examen</h2>
    <hr />
    <form action="">
      <div>
        <label for="nombre-completo">Nombre del Alumno</label>
        <input type="text" id="nombre-completo" name="nombre-completo" />
      </div>

      <div>
        <label for="legajo">Numero de Legajo</label>
        <input type="number" id="legajo" name="legajo" />
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
      </div>
      <hr />

      <div>
        <label for="materia">Materia a rendir</label>
        <input type="text" id="materia" name="materia" />
      </div>

      <input type="submit" value="Anotarse a Examen" />
    </form>
  </body>
</html>
