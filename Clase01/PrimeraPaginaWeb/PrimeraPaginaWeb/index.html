<!DOCTYPE html>
<!--Etiqueta raiz <html> -->
<html>  
    <!--Informacion NO visible(metadata, links, etc)-->
    <head>
        
        <title>Muestra pagina 334</title>
        <style>
            /*Funte para todos los elementos de la pagina*/
            body{

                font-family: monospace
            }

        </style>

    </head>

    <!--Informacion visible (Cuerpo de la pagina)-->
    <body>
        <!-- h1 refiere a encabezado (heading) tamaño: 1-->
        <h1>Pagina de mi amorcito</h1>

        <h3>te amo mi amorcito</h3>
        <!-- a viene de "anchor" o anca (enlace)
         href para ingresas vinculo a donde me quiero dirigir
         El atributo target se refiere a donde se va a abrir ese enlace
         -->
        <a href="https://www.w3schools.com/html/html_attributes.asp"
        target="_blank"
        > Atributos HTML</a>

        <p>Parrafo de información</p>

        <p>Informacino de lo que quiero hablar</p>
        <!--Titulo intermedio-->
        <h4>Discografia de divididos</h4>
        <!-- Lista Ordenada -->
        <ol>
            <li>Disco 1</li>
            <li>Disco 2</li>
            <li>Disco 3</li>
            <li>Disco 4</li></ol>
        
        <!-- Listas Desordenada -->
        <h5>Integrantes</h5>
        <ul>
            <li>Cantante</li>
            <li>Guitarrista</li>
            <li>Baterista</li>
        </ul>


        <img width="300" src="https://cdn.rock.com.ar/wp-content/uploads/2023/04/Spaghetti-Western.jpeg" alt="Foto de divididos">
    </body>
</html>
